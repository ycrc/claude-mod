# Host tool directories prepended to PATH inside the coding agents container.
#
# Each entry must be an absolute directory covered by a bind configured in
# coding-agents-bind.conf. Missing paths are skipped, allowing this configuration to
# work on Bouchet when optional site-specific tools are unavailable.
# Apptainer's standard container PATH remains available after these entries.

path_entries=(
    "$HOME/.pixi/bin"
    "/apps/bin"
    "/opt/slurm/current/bin"
    "/share/admins/bin"
)
