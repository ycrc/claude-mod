# Administrator-owned Bouchet provider/site settings.
# This file is installed alongside the launcher and sourced after inherited
# credentials and Apptainer/Singularity override variables are removed.
YCRC_CLUSTER='bouchet'
YCRC_AGENT_MODEL='Qwen3.8-27B'
YCRC_AGENT_AUTH='dummy-key'
YCRC_AGENT_MAX_CONTEXT='262000'
YCRC_AGENT_MAX_OUTPUT='16384'
YCRC_AGENT_MAX_PROMPT='245616'
YCRC_CLAUDE_BASE_URL='http://a1127u31n01.mghpcc.ycrc.yale.edu:8008'
YCRC_CLAUDE_EFFORT='xhigh'
YCRC_COPILOT_BASE_URL='http://a1127u31n01.mghpcc.ycrc.yale.edu:8008/v1'

# Per-netid usage accounting. The launcher reports one session record per
# invocation to this endpoint, which runs beside the inference server and is
# scraped by Prometheus. Records carry only netid, harness, timing and exit
# status -- never prompts, paths or arguments. Comment this out to disable
# accounting; the launcher then skips reporting entirely.
YCRC_AGENT_USAGE_ENDPOINT='http://a1127u31n01.mghpcc.ycrc.yale.edu:9103/ingest'
# Optional shared secret. Must match COLLECTOR_TOKEN on the collector. This
# only deters casual forgery: users can read it from their own environment.
YCRC_AGENT_USAGE_TOKEN=''
