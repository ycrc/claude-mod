# Case-sensitive Bash glob patterns for exported environment-variable names
# that must not be inherited by Claude or other processes in the container.
#
# Quote every pattern so the shell does not expand it as a filesystem glob when
# this administrator-controlled file is loaded. Values are never inspected or
# printed; only matching variable names are reported.

sensitive_env_patterns=(
    '*API*'
    '*TOKEN*'
    '*SECRET*'
    '*PASSWORD*'
    '*PASSWD*'
    '*CREDENTIAL*'
    '*_KEY'
    '*_KEY_*'
    '*COOKIE*'
    '*JWT*'
    '*WEBHOOK*'
    '*CONNECTION_STRING*'
    '*DATABASE_URL*'
    '*DATABASE_URI*'
    '*DSN*'
    '*_PASS'
    '*_PWD'
    'SSH_AUTH_SOCK'
    'KRB5CCNAME'
    'X509_USER_PROXY'
    'KUBECONFIG'
    'DOCKER_AUTH_CONFIG'
)
