# Host tool directories prepended to PATH inside the Claude container.
#
# Each entry must be an absolute directory covered by a bind configured in
# claude-bind.conf. Missing paths are skipped, allowing this configuration to
# work across clusters where some site-specific tools are unavailable.
# Apptainer's standard container PATH remains available after these entries.

path_entries=(
    "$HOME/.pixi/bin"
    "/apps/bin"
    "/opt/slurm/current/bin"
    "/share/admins/bin"
    "/gpfs/gibbs/pi/support/software/bin"
    "/gpfs/gibbs/public/getusage/script"
)
