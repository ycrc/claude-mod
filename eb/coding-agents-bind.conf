# Additional host directories exposed inside the coding agents container.
#
# Each entry is followed optionally by :ro or :rw.
# Omitting the mode uses Apptainer's default bind permissions (read-write).
# Shell variables such as $HOME are expanded when this file is loaded.
#
# Missing paths are skipped. Symlinks are resolved, and the resolved directory
# is bound at its physical path inside the container. coding agents cannot be launched
# from a configured directory or any directory below it.

# Slurm requires
# /opt/slurm/current, /var/lob/slurmconf, /run/munge

binds=(
    "$HOME/.claude-ycrc:rw"
    "$HOME/.codex-ycrc:rw"
    "$HOME/.pi-ycrc:rw"
    "$HOME/.copilot-ycrc:rw"
    "$HOME/.cache/copilot-ycrc:rw"
    "$HOME/.conda:rw"
    "$HOME/.conda/envs:rw"
    "$HOME/.conda/pkgs:rw"
    "$HOME/.pixi:rw"
    "$HOME/R:rw"
    "/apps:ro"
    "/opt/slurm/current:ro"
    "/var/lib/slurmconf:ro"
    "/run/munge:ro"
    "/share/admins:ro"
)
